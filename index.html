<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#79bce8">
  <title>Tu mine et tu craft</title>
  <link rel="stylesheet" href="./style.css?v=inventory-touch-landscape-20261110">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game">
    <div id="sky-label">TU MINE ET TU CRAFT</div>
    <div id="crosshair">+</div>
    <div id="hint">Clique dans le monde pour jouer · WASD pour bouger · Espace pour sauter</div>
    <div id="toolbar" aria-label="Barre de blocs">
      <button class="slot selected" data-block="grass" title="Herbe">🟩<small>1</small><b class="item-count" data-count="grass">0</b></button>
      <button class="slot" data-block="dirt" title="Terre">🟫<small>2</small><b class="item-count" data-count="dirt">0</b></button>
      <button class="slot" data-block="stone" title="Pierre">⬜<small>3</small><b class="item-count" data-count="stone">0</b></button>
      <button class="slot" data-block="wood" title="Bois">🪵<small>4</small><b class="item-count" data-count="wood">0</b></button>
      <button class="slot" data-block="leaves" title="Feuilles">🌿<small>5</small><b class="item-count" data-count="leaves">0</b></button>
      <button class="slot" data-block="coal" title="Charbon récolté"><canvas class="item-icon" data-ore-icon="coal" width="32" height="32"></canvas><small>6</small><b class="item-count" data-count="coal">0</b></button>
      <button class="slot" data-block="iron" title="Fer brut récolté"><canvas class="item-icon" data-ore-icon="raw_iron" width="32" height="32"></canvas><small>7</small><b class="item-count" data-count="raw_iron">0</b></button>
      <button class="slot" data-block="gold" title="Or brut récolté"><canvas class="item-icon" data-ore-icon="raw_gold" width="32" height="32"></canvas><small>8</small><b class="item-count" data-count="raw_gold">0</b></button>
      <button class="slot" data-block="diamond" title="Diamants récoltés"><canvas class="item-icon" data-ore-icon="diamond" width="32" height="32"></canvas><small>9</small><b class="item-count" data-count="diamond">0</b></button>
    </div>
    <div id="mobile-controls">
      <div id="joystick"><div id="stick"></div></div>
      <div id="look-zone"></div>
      <div id="mobile-actions">
        <button id="jump">↑</button>
        <button id="break">⛏</button>
        <button id="place">＋</button>
      </div>
    </div>
    <div id="debug-status">Diagnostic : chargement du moteur 3D…</div>
    <div id="loading">Génération du monde…</div>
    <div id="error" hidden></div>
  </div>
  <script type="module">
    const errorBox = document.querySelector('#error');
    function showGameError(error) {
      errorBox.hidden = false;
      errorBox.textContent = ['ERREUR DU JEU 3D', (error && (error.stack || error.message) ? (error.stack || error.message) : String(error)), 'Vérifie ta connexion Internet puis recharge la page.'].join(String.fromCharCode(10) + String.fromCharCode(10));
      console.error(error);
    }
    addEventListener('error', event => showGameError(event.error || event.message));
    addEventListener('unhandledrejection', event => showGameError(event.reason));
    import('./src/main.js?v=cc0-audio-pack-20261110').catch(showGameError);
  </script>
</body>
</html>
