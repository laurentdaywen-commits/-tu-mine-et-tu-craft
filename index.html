<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#79bce8">
  <title>Tu mine et tu craft</title>
  <link rel="stylesheet" href="./style.css?v=welcome-screen-20261113">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game">
    <section id="welcome-screen" aria-label="Écran d'accueil">
      <div class="welcome-sky"></div>
      <div class="welcome-sun"></div>
      <div class="welcome-cloud cloud-one"></div>
      <div class="welcome-cloud cloud-two"></div>
      <div class="welcome-hills">
        <div class="welcome-hill hill-back"></div>
        <div class="welcome-hill hill-front"></div>
      </div>
      <div class="welcome-tree tree-left"><i></i><b></b></div>
      <div class="welcome-tree tree-right"><i></i><b></b></div>
      <div class="welcome-content">
        <div class="welcome-eyebrow">UN MONDE À CONSTRUIRE</div>
        <h1>TU MINE ET<br> TU CRAFT</h1>
        <p>Explore, récolte et bâtis ton univers.</p>
        <button id="welcome-play" type="button">JOUER</button>
      </div>
      <div class="welcome-footer">Un monde infini d'aventures t'attend</div>
    </section>
    <div id="sky-label">TU MINE ET TU CRAFT</div>
    <details id="world-seed-panel">
      <summary>Graine : <strong id="world-seed-value">...</strong></summary>
      <div class="seed-tools">
        <input id="world-seed-input" type="text" inputmode="numeric" aria-label="Graine du monde" placeholder="Saisir une graine">
        <button id="world-seed-apply" type="button">Charger</button>
        <button id="world-seed-copy" type="button">Copier</button>
        <button id="world-seed-new" type="button">Nouveau monde</button>
      </div>
    </details>
    <div id="crosshair">+</div>
    <div id="hint">Clique dans le monde pour jouer · WASD pour bouger · Espace pour sauter</div>
    <div id="toolbar" aria-label="Barre de blocs">
      <button class="slot selected" data-block="grass" title="Herbe">🟩<b class="item-count" data-count="grass">0</b></button>
      <button class="slot" data-block="dirt" title="Terre">🟫<b class="item-count" data-count="dirt">0</b></button>
      <button class="slot" data-block="stone" title="Pierre">⬜<b class="item-count" data-count="stone">0</b></button>
      <button class="slot" data-block="wood" title="Bois">🪵<b class="item-count" data-count="wood">0</b></button>
      <button class="slot" data-block="leaves" title="Feuilles">🌿<b class="item-count" data-count="leaves">0</b></button>
      <button class="slot" data-block="coal" title="Charbon récolté"><canvas class="item-icon" data-ore-icon="coal" width="32" height="32"></canvas><b class="item-count" data-count="coal">0</b></button>
      <button class="slot" data-block="iron" title="Fer brut récolté"><canvas class="item-icon" data-ore-icon="raw_iron" width="32" height="32"></canvas><b class="item-count" data-count="raw_iron">0</b></button>
      <button class="slot" data-block="gold" title="Or brut récolté"><canvas class="item-icon" data-ore-icon="raw_gold" width="32" height="32"></canvas><b class="item-count" data-count="raw_gold">0</b></button>
      <button class="slot" data-block="diamond" title="Diamants récoltés"><canvas class="item-icon" data-ore-icon="diamond" width="32" height="32"></canvas><b class="item-count" data-count="diamond">0</b></button>
    </div>
    <div id="mobile-controls">
      <div id="joystick"><div id="stick"></div></div>
      <div id="look-zone"></div>
      <div id="mobile-actions">
        <button id="jump">↑</button>
        <button id="break">⛏</button>
        <button id="place">＋</button>
      </div>
    </div>
    <div id="debug-status">Diagnostic : chargement du moteur 3D…</div>
    <div id="loading">Génération du monde…</div>
    <div id="error" hidden></div>
  </div>
  <script type="module">
    const errorBox = document.querySelector('#error');
    function showGameError(error) {
      errorBox.hidden = false;
      errorBox.textContent = ['ERREUR DU JEU 3D', (error && (error.stack || error.message) ? (error.stack || error.message) : String(error)), 'Vérifie ta connexion Internet puis recharge la page.'].join(String.fromCharCode(10) + String.fromCharCode(10));
      console.error(error);
    }
    addEventListener('error', event => showGameError(event.error || event.message));
    addEventListener('unhandledrejection', event => showGameError(event.reason));
    const welcomeScreen = document.querySelector('#welcome-screen');
    const playButton = document.querySelector('#welcome-play');
    playButton.addEventListener('click', () => {
      playButton.disabled = true;
      playButton.textContent = 'CHARGEMENT...';
      welcomeScreen.classList.add('welcome-leaving');
      document.querySelector('#loading').classList.remove('done');
      import('./src/main.js?v=seeded-world-60000000-20261113').catch(showGameError);
      window.setTimeout(() => welcomeScreen.remove(), 450);
    });
  </script>
</body>
</html>
