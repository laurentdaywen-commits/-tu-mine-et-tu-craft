<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#79bce8">
  <title>Tu mine et tu craft</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game">
    <div id="sky-label">TU MINE ET TU CRAFT</div>
    <div id="crosshair">+</div>
    <div id="hint">Clique dans le monde pour jouer · WASD pour bouger · Espace pour sauter</div>
    <div id="toolbar" aria-label="Barre de blocs">
      <button class="slot selected" data-block="grass" title="Herbe">🟩<small>1</small></button>
      <button class="slot" data-block="dirt" title="Terre">🟫<small>2</small></button>
      <button class="slot" data-block="stone" title="Pierre">⬜<small>3</small></button>
      <button class="slot" data-block="wood" title="Bois">🪵<small>4</small></button>
      <button class="slot" data-block="leaves" title="Feuilles">🌿<small>5</small></button>
      <button class="slot" data-block="coal" title="Minerai de charbon">⚫<small>6</small></button>
      <button class="slot" data-block="iron" title="Minerai de fer">🩶<small>7</small></button>
      <button class="slot" data-block="gold" title="Minerai d'or">🟨<small>8</small></button>
      <button class="slot" data-block="diamond" title="Minerai de diamant">💎<small>9</small></button>
    </div>
    <div id="mobile-controls">
      <div id="joystick"><div id="stick"></div></div>
      <div id="look-zone"></div>
      <div id="mobile-actions">
        <button id="jump">↑</button>
        <button id="break">⛏</button>
        <button id="place">＋</button>
      </div>
    </div>
    <div id="debug-status">Diagnostic : chargement du moteur 3D…</div>
    <div id="loading">Génération du monde…</div>
    <div id="error" hidden></div>
  </div>
  <script type="module">
    const errorBox = document.querySelector('#error');
    function showGameError(error) {
      errorBox.hidden = false;
      errorBox.textContent = ['ERREUR DU JEU 3D', (error && (error.stack || error.message) ? (error.stack || error.message) : String(error)), 'Vérifie ta connexion Internet puis recharge la page.'].join(String.fromCharCode(10) + String.fromCharCode(10));
      console.error(error);
    }
    addEventListener('error', event => showGameError(event.error || event.message));
    addEventListener('unhandledrejection', event => showGameError(event.reason));
    import('./src/main.js?v=textures-classic-20261109').catch(showGameError);
  </script>
</body>
</html>
